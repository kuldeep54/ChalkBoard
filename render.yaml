services:
  - type: web
    name: chalkboard-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: ACCESS_TOKEN_EXPIRE
        value: 15m
      - key: CORS_ORIGIN
        value: "*"
      - key: AUTH_BASE_URL
        value: chalkboard://
      - key: MAIL_FROM
        value: ChalkBoard <KULDEEP_EMAIL_REDACTED>
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BREVO_API_KEY
        sync: false